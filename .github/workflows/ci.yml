name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/init-local.mjs
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose exec -T soundbox-api node dist/scripts/verify-stack.js
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop test stack
        if: always()
        run: docker compose down
