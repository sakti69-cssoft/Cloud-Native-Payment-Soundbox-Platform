name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soundbox_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: soundbox_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U soundbox_test -d soundbox_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://soundbox_test:ci-test-only-password@localhost:5432/soundbox_test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
