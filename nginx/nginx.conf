worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  # The production container runs as the unprivileged nginx user. Keep all
  # request temporary files out of the root-owned /var/cache/nginx tree.
  client_body_temp_path /tmp/nginx-client-temp;
  proxy_temp_path /tmp/nginx-proxy-temp;
  fastcgi_temp_path /tmp/nginx-fastcgi-temp;
  uwsgi_temp_path /tmp/nginx-uwsgi-temp;
  scgi_temp_path /tmp/nginx-scgi-temp;
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  server_tokens off;
  server {
    listen 8080;
    client_max_body_size 64k;
    location / {
      proxy_pass http://soundbox-api:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
